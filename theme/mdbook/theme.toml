# Reuse shared components, then replace the page shell.
template-dirs = ["../default/templates", "../shared", "templates"]
stylesheets = ["_theme/mdbook/variables.css", "_theme/mdbook/chrome.css", "_theme/shared/content.css", "_theme/mdbook/main.css", "_theme/shared/embedded-toc.css"]
scripts = ["_theme/mdbook/panels.js", "_theme/mdbook/main.js"]

[assets]
"_theme/mdbook/variables.css" = "variables.css"
"_theme/mdbook/chrome.css" = "chrome.css"
"_theme/mdbook/main.css" = "main.css"
"_theme/mdbook/main.js" = "main.js"
"_theme/mdbook/panels.js" = "../default/main.js"
"_theme/shared/content.css" = "../shared/content.css"
"_theme/shared/embedded-toc.css" = "../shared/embedded-toc.css"

# Theme-owned defaults and optional validation rules.
[defaults]
site-tree = true
[defaults.toc]
enabled = true
mode = "split"

[option-schema.site-tree]
type = "boolean"
[option-schema."toc.enabled"]
type = "boolean"
[option-schema."toc.mode"]
type = "string"
enum = ["embedded", "split"]
