[package]
name = "typst-ssg"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
handlebars = { version = "6", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
typst = "=0.15.1"
typst-bundle = "=0.15.1"
typst-kit = { version = "=0.15.1", features = ["embedded-fonts", "scan-fonts", "system-files", "system-downloader", "datetime"] }

[profile.dev]
debug = 0
